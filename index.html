<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 3 - Aumatizacion pag web con github pages - Hola Mundo</title>
    <style>
        /* Estilos generales de la página */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; /* Color de fondo claro y moderno */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Ocupa toda la altura de la pantalla */
            color: #333;
        }

        /* Contenedor principal estilo tarjeta */
        .contenedor {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); /* Sombra suave */
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* Estilo del título principal */
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        /* Estilo del texto */
        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
        }

        /* Estilo para destacar texto */
        .destacado {
            color: #3498db;
            font-weight: bold;
        }

        /* Estilo del botón (decorativo) */
        .boton {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .boton:hover {
            background-color: #2980b9;
        }

        /* Pie de página pequeño dentro de la tarjeta */
        .footer {
            margin-top: 30px;
            font-size: 0.85em;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>¡Hola Mundo! 🌍</h1>
        <p>Esta es mi <span class="destacado">Práctica 3</span> de la clase.</p>
        <p>Esta página ha sido desplegada de forma  automática utilizando un repositorio y la herramienta de <strong>GitHub Pages</strong>.</p>
        
        <a href="#" class="boton">¡Funciona!</a>
        
        <div class="footer">
            Despliegue automatizado en la nube ☁️
        </div>
    </div>

</body>
</html>
